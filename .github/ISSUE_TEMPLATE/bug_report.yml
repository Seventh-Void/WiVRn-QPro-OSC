name: Bug report
description: Something in WiVRn-QPro-OSC doesn't work (face tracking over OSC, VRChat, Resonite, pupils, dashboard, install).
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [README setup steps](https://github.com/Seventh-Void/WiVRn-QPro-OSC#set-up) first.
        Only the first three questions are required; the rest helps fix it faster.

  - type: dropdown
    id: area
    attributes:
      label: What isn't working?
      options:
        - Face / eye tracking in VRChat
        - Face / eye tracking in Resonite
        - Tongue tracking
        - Camera pupil tracking
        - Dashboard
        - Installing or building
        - Something else in WiVRn (streaming, connection, controllers…)
    validations:
      required: true

  - type: dropdown
    id: headset
    attributes:
      label: Headset setup
      options:
        - Stock Quest Pro (not rooted)
        - Rooted Quest Pro with BoltOn (VRCFT mode)
        - Rooted Quest Pro without BoltOn
        - Other headset
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I turned on Face tracking over OSC, restarted the server and joined VRChat, but my avatar's mouth doesn't move.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pacman -Q wivrn-server`, or the release tag / commit you built.
      placeholder: wivrn-server 26.9-2

  - type: input
    id: distro
    attributes:
      label: Linux distribution and GPU
      placeholder: CachyOS, AMD RX 7800 XT

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: |
        Dashboard → **Troubleshoot** → **Open server logs**, then attach the newest `server_logs_*.txt` (drag the file here).
      placeholder: Drag the log file here, or paste the lines around the problem.

  - type: textarea
    id: config
    attributes:
      label: Server config
      description: Content of `~/.config/wivrn/config.json` (at least the `vrchat-osc` and `qpro-pupils` parts).
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: Screenshots (e.g. the Pupil tracking page), avatar used, does it also happen with stock WiVRn…
