name: WayVR watch stats bug
description: Something in the fpsVR-style WayVR watch stats (contrib/wayvr-fpsvr) doesn't work, or WayVR crashed with it.
title: "[WayVR stats]: "
labels:
  - bug
  - wayvr-stats

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [WayVR stats README](https://github.com/Seventh-Void/WiVRn-QPro-OSC/tree/qpro-osc/contrib/wayvr-fpsvr#readme) first.
        Only the first three questions are required; the rest helps fix it faster.

  - type: dropdown
    id: area
    attributes:
      label: What isn't working?
      options:
        - WayVR crashed or closed
        - Stats panel stays empty / shows only "--"
        - Graphs don't show or don't move
        - FPS / frame times / colours look wrong
        - GPU temperature / load / VRAM wrong or "--" (NVIDIA support is untested)
        - Settings → FPS stats tab, Full / Minimal mode, show/hide switches
        - Hide / Show stats button
        - Game time or VRChat world time (VRCX) under the clock
        - Add-on files (fpsvr-stats.xml / fpsvr-button.xml / fpsvr-clock.xml) in my own watch
        - Installing (script, systemd units, patched WayVR)
        - Something else
    validations:
      required: true

  - type: dropdown
    id: watch
    attributes:
      label: Which watch do you use?
      options:
        - watch.xml (white) from this fork
        - watch-purple.xml from this fork
        - My own watch with the fpsvr-*.xml add-ons
        - My own watch with parts copied in by hand
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Which game, and did it work before?
      placeholder: |
        I started VRChat with the patched WayVR and graphs turned on. After about 10 minutes WayVR closed.
    validations:
      required: true

  - type: textarea
    id: crash
    attributes:
      label: WayVR crash log (if WayVR crashed)
      description: |
        `wayvr-stats` saves WayVR's log when WayVR crashes: attach the newest `~/.local/state/wayvr-stats/crash-*.log` (drag the file here).
        If there is none, attach `~/.local/state/wayvr-stats/last-wayvr.log` (the log of the last WayVR that exited) or `/tmp/wayvr.log` (the running one; it's wiped when WayVR starts again).
      placeholder: Drag the log file here.

  - type: textarea
    id: stats_log
    attributes:
      label: Stats script log
      description: Output of `journalctl --user -u wayvr-stats.service -b --no-pager | tail -n 100`
      render: text

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `wayvr --version` and `wivrn-server --version`, and how you installed them (release package, makepkg, built from source).
      placeholder: wayvr 26.8.0 (release package 26.8.0-1.3), WiVRn version 26.9 (built from source on Fedora 43)

  - type: textarea
    id: service
    attributes:
      label: Settings
      description: Output of `cat ~/.config/wayvr-stats/settings.json; systemctl --user cat wayvr-stats.service`
      render: text

  - type: input
    id: distro
    attributes:
      label: Linux distribution, CPU, GPU and GPU driver
      description: GPU stats are read from amdgpu (AMD) or NVML (NVIDIA proprietary driver, untested); CPU temperature needs k10temp or coretemp. For NVIDIA, include the output of `nvidia-smi`.
      placeholder: Fedora 43, Ryzen 7 7800X3D, NVIDIA RTX 4070 (driver 580.95)

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: A photo or screenshot of the watch, your own watch.xml if you use the add-ons, VRCX running or not…
