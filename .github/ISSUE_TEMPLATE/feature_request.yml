name: Feature request
description: Suggest something for WiVRn-QPro-OSC (OSC output, pupils, more games…).
title: "[Feature Request]: "
labels:
  - enhancement

body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: Send eye tracking to ChilloutVR too.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: Screenshots, links, examples, how you'd like it to work…
